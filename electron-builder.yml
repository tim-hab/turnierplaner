appId: de.timhab.turnierplaner
productName: Turnierplaner

directories:
  output: release

toolsets:
  wine: 1.0.1

files:
  - electron-dist/**/*
  - dist/turnierplaner/browser/**/*
  - package.json

win:
  icon: build/icon.svg
  publisherName: tim-hab
  signingHashAlgorithms:
    - sha256
  target:
    - target: nsis
      arch:
        - x64

publish:
  provider: github
  owner: tim-hab
  repo: turnierplaner
  releaseType: release

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Turnierplaner
