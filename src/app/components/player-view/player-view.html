<div class="app-player-view-wrapper">
  <h2>
    Spieler ({{ playerService.player().length }} / aktiv {{ playerService.activePlayerCount() }})
  </h2>

  <div class="player-list">
    @for (player of [...playerService.player()].sort(sortByName); track player.id) {
      <div class="player-view-content">
        @if (editingId !== player.id) {
          <button matButton (click)="editName(player)" class="text-button">
            {{ player.name }} ({{ player.club }})
          </button>
        }

        @if (editingId === player.id) {
          <mat-form-field appearance="outline" class="name-input">
            <input
              [id]="'name-input-' + player.id"
              matInput
              type="text"
              [value]="player.name"
              (blur)="saveName(player)"
              (keyup.enter)="saveName(player)"
              (input)="updateName($event.target)"
              appSelectOnFocusDirective
            />
          </mat-form-field>
        }

        <button
          [class]="'player-view-delete-button ' + (player.active ? 'active' : 'inactive')"
          matButton="filled"
          (click)="playerService.toggleActivePlayer(player)"
        >
          @if (player.active) {
            Aktiv
          } @else {
            Inaktiv
          }
        </button>
      </div>
    }
  </div>
</div>
