<div class="app-control-wrapper">
  @switch (activeRoute()) {
    @case (Route.Settings) {
      <app-add-player-card></app-add-player-card>
      <app-player-view></app-player-view>
    }
    @case (Route.FieldView) {
      <app-field-view></app-field-view>
      <app-game-history></app-game-history>
    }
    @case (Route.TableView) {
      <app-live-table></app-live-table>
      <!-- <app-tournament-evaluation></app-tournament-evaluation> -->
    }
  }
</div>
