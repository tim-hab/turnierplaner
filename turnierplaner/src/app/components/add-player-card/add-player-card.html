<div class="add-player-card-wrapper">
  <form [formGroup]="form">
    <mat-card class="add-player-card" appearance="outlined">
      <mat-card-header>Spieler hinzufügen/ Nachrücker</mat-card-header>
      <mat-card-content class="add-player-card-content">
        <mat-form-field appearance="outline">
          <input matInput placeholder="Name" [formControlName]="'nameControl'" (keyup.enter)="addPlayer($event)"/>
          <mat-error>Feld darf nicht leer sein!</mat-error>
        </mat-form-field>
        <mat-form-field>
          <mat-select [formControlName]="'clubControl'">
            @for (club of playerService.clubs(); track club) {
              <mat-option [value]="club">{{ club }}</mat-option>
            }
          </mat-select>
          <mat-error>Feld darf nicht leer sein!</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <input matInput type="number" min="0" step="100" [formControlName]="'eloControl'" />
          <mat-error>Feld darf nicht leer sein!</mat-error>
        </mat-form-field>
      </mat-card-content>
      <mat-card-actions class="add-player-card-actions">
        <button matButton="filled" (click)="addPlayer($event)">Hinzufügen</button>
        <button matButton="outlined" (click)="addClub($event)">Verein hinzufügen</button>
      </mat-card-actions>
    </mat-card>
  </form>
</div>
