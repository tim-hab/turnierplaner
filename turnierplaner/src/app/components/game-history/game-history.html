<h2>Spielhistorie</h2>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- Position Column -->
  <ng-container matColumnDef="round">
    <th mat-header-cell *matHeaderCellDef> Runde </th>
    <td mat-cell *matCellDef="let element"> {{element.round}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="field">
    <th mat-header-cell *matHeaderCellDef> Feld </th>
    <td mat-cell *matCellDef="let element"> {{element.field}} </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="teamA">
    <th mat-header-cell *matHeaderCellDef> Team A </th>
    <td mat-cell *matCellDef="let element"> {{element.teamA}} </td>
  </ng-container>

  <ng-container matColumnDef="teamB">
    <th mat-header-cell *matHeaderCellDef> Team B </th>
    <td mat-cell *matCellDef="let element"> {{element.teamB}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="score">
    <th mat-header-cell *matHeaderCellDef> Score </th>
    <td mat-cell *matCellDef="let element"> {{element.score}} </td>
  </ng-container>

  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef> Aktion </th>
    <td mat-cell *matCellDef="let element"> 
        <button matButton="filled" (click)="test(element)">Bearbeiten</button> </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
