<h2>
  @if (tournamentService.running()) {
    Live-Tabelle
  } @else {
    End-Tabelle
  }
</h2>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>
  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- Name Column -->
  <ng-container matColumnDef="player">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Spieler</th>
    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
  </ng-container>

  <!-- Club Column -->
  <ng-container matColumnDef="club">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Verein</th>
    <td mat-cell *matCellDef="let element">{{ element.club }}</td>
  </ng-container>

  <!-- ELO Column -->
  <ng-container matColumnDef="elo">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>ELO</th>
    <td mat-cell *matCellDef="let element">{{ round(element.elo) }}</td>
  </ng-container>

  <!-- Points Column -->
  <ng-container matColumnDef="points">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Punkte</th>
    <td mat-cell *matCellDef="let element">{{ element.points }}</td>
  </ng-container>

  <!-- Wins Column -->
  <ng-container matColumnDef="wins">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>S</th>
    <td mat-cell *matCellDef="let element">{{ element.wins }}</td>
  </ng-container>

  <!-- Losses Column -->
  <ng-container matColumnDef="losses">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>N</th>
    <td mat-cell *matCellDef="let element">{{ element.losses }}</td>
  </ng-container>

  <!-- Frees Column -->
  <ng-container matColumnDef="frees">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>ausgesetzt</th>
    <td mat-cell *matCellDef="let element">{{ element.frees }}</td>
  </ng-container>

  <!-- Played Column -->
  <ng-container matColumnDef="played">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>gespielt</th>
    <td mat-cell *matCellDef="let element">{{ element.played }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
