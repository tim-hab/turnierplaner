<h2>Spieler</h2>
<mat-list>
  @for (player of playerService.player(); track player) {
    <mat-list-item class="player-view-player"
      >{{ player.name }} ({{ player.club }}) - ELO:{{ player.elo }}
      <button class="player-view-delete-button" matButton="filled" ()>
        <mat-icon>delete_outline</mat-icon> Entfernen
      </button>
    </mat-list-item>
  }
</mat-list>
