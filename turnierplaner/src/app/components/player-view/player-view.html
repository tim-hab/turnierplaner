<div class="app-player-view-wrapper">
  <h2>Spieler</h2>
  <mat-list>
    @for (player of playerService.player(); track player) {
      <mat-list-item class="player-view-player"
        >{{ player.name }} ({{ player.club }}) - ELO:{{ round(player.elo) }}
        <!-- <button class="player-view-delete-button" matIconButton="filled" ()>
          <mat-icon>delete_outline</mat-icon>
        </button> -->
      </mat-list-item>
    }
  </mat-list>
</div>
