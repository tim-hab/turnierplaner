<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>🏸 Badminton JuxTurnier-App | Jan Elpers™</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#f8f9fa; }
.card { margin-bottom:1rem; }
.team-a { background:#e3f2fd; padding:0.5rem; border-radius:5px; }
.team-b { background:#e8f5e9; padding:0.5rem; border-radius:5px; }
.avatar { font-size:1.5rem; margin-right:0.5rem; }
</style>
</head>
<body class="container py-4">
<h1 class="mb-4">🏸 Badminton JuxTurnier-App | Jan Elpers™</h1>

<!-- Spieler hinzufügen -->
<div class="card mb-4">
<div class="card-header">Spieler hinzufügen / Nachrücker</div>
<div class="card-body row g-3">
<div class="col-md-3"><input id="playerName" class="form-control" placeholder="Name"></div>
<div class="col-md-3">
<select id="playerClub" class="form-select">
<option value="" disabled selected>Verein wählen</option>
</select>
</div>
<div class="col-md-2"><button class="btn btn-outline-secondary w-100" onclick="addClub()">🏷️ Verein hinzufügen</button></div>
<div class="col-md-2"><input id="playerStrength" type="number" step="0.1" min="1" max="10" class="form-control" placeholder="Stärke"></div>
<div class="col-md-2"><button class="btn btn-primary w-100" onclick="addPlayer()">➕ Hinzufügen</button></div>
</div>
</div>

<!-- Turniersteuerung -->
<div class="mb-4 row g-2">
<div class="col-auto">
<label for="fields" class="form-label">Felder:</label>
<input id="fields" type="number" value="4" min="1" class="form-control w-auto d-inline-block">
</div>
<div class="col-auto">
<label for="totalRounds" class="form-label">Runden gesamt:</label>
<input id="totalRounds" type="number" value="5" min="1" class="form-control w-auto d-inline-block">
</div>
<div class="col-auto align-self-end">
<button class="btn btn-success" onclick="startTournament()">▶️ Turnier starten</button>
<button class="btn btn-warning" onclick="nextRound()">🔄 Nächste Runde</button>
<button class="btn btn-danger" onclick="endTournament()">⏹️ Turnier beenden</button>
<button class="btn btn-secondary" onclick="exportCSV()">📥 Export CSV</button>
</div>
<div class="col-auto align-self-end">
<div class="form-check form-switch d-inline">
<input class="form-check-input" type="checkbox" id="showProb" onchange="renderMatches()">
<label class="form-check-label" for="showProb">Siegwahrscheinlichkeit anzeigen</label>
</div>
</div>
</div>

<h3>Spieler</h3>
<ul id="playerList" class="list-group mb-4"></ul>

<h3>Aktuelle Runde</h3>
<div id="matches" class="row"></div>

<h3>Spielhistorie</h3>
<table class="table table-bordered" id="historyTable">
<thead><tr><th>Runde</th><th>Feld</th><th>Team A</th><th>Team B</th><th>Score</th><th>Aktion</th></tr></thead>
<tbody></tbody>
</table>

<h3>Live-Tabelle</h3>
<table class="table table-striped" id="rankingTable">
<thead><tr><th>Spieler</th><th>Verein</th><th>ELO</th><th>S</th><th>N</th></tr></thead>
<tbody></tbody>
</table>

<div id="summary" style="display:none;">
<h3>📊 Turnierauswertung</h3>
<table class="table table-bordered">
<thead><tr><th>Spieler</th><th>Start</th><th>Ende (ELO)</th></tr></thead>
<tbody id="summaryTable"></tbody>
</table>
</div>

<script>
let players=[], clubs=[], matches=[], round=0, totalRounds=5, history=[];

// --- Clubs ---
function populateClubs(){
  const select=document.getElementById("playerClub");
  select.innerHTML=`<option value="" disabled selected>Verein wählen</option>`;
  clubs.forEach(c=>{const opt=document.createElement("option"); opt.value=c; opt.textContent=c; select.appendChild(opt);});
}
populateClubs();
function addClub(){const name=prompt("Name des Vereins eingeben:"); if(name&&!clubs.includes(name)){clubs.push(name);populateClubs(); alert(`Verein "${name}" hinzugefügt!`);}}

function randomEmoji(){
  const emojis=["🐶","🐱","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐵","🐔","🐧","🦆","🦅","🦉","🦇","🐺","🐴","🦄","🐝","🐛","🦋","🐌","🐞","🐢","🐍","🦎","🦖","🐙","🦑","🦐","🦞","🦀","🐡","🐬","🐳","🐋","🦈","🐊","🦓","🦍","🦧","🦣","🦒","🦘","🦥","🦦","🦨","🦡","🦫","🐘","🦏","🦛"];
  return emojis[Math.floor(Math.random()*emojis.length)];
}

// --- Spieler ---
function addPlayer(){
  const name=document.getElementById("playerName").value.trim();
  const club=document.getElementById("playerClub").value;
  const strength=parseFloat(document.getElementById("playerStrength").value);
  if(!name||!club||isNaN(strength)) return alert("Bitte Name, Verein und Stärke eingeben!");
  const player={id:Date.now(),name,club,startStrength:strength,elo:strength*100,wins:0,losses:0,emoji:randomEmoji(),eloChange:0,frees:0,played:0};
  players.push(player);
  renderPlayers();
}

function renderPlayers(){
  const list=document.getElementById("playerList");
  list.innerHTML="";
  players.forEach(p=>{
    const li=document.createElement("li");
    li.className="list-group-item d-flex justify-content-between align-items-center";
    li.innerHTML=`<span>${p.emoji} ${p.name} (${p.club}) – ELO: ${p.elo.toFixed(0)}</span>
    <button class="btn btn-sm btn-danger" onclick="removePlayer(${p.id})">❌ Entfernen</button>`;
    list.appendChild(li);
  });
  renderRanking();
}

function removePlayer(id){
  if(!confirm("Spieler wirklich entfernen?")) return;
  players=players.filter(p=>p.id!==id);
  renderPlayers();
}

// --- Turnier ---
function startTournament(){
  if(players.length<4) return alert("Mindestens 4 Spieler!");
  round=1;
  totalRounds=parseInt(document.getElementById("totalRounds").value)||5;
  generateMatches();
}

function nextRound(){
  if(round>=totalRounds){ alert("Maximale Runden erreicht"); return; }
  round++;
  generateMatches();
  alert("Runde "+round+" gestartet!");
}

// --- Match-Generierung ---
function generateMatches(){
  matches=[];
  let activePlayers=[...players].sort((a,b)=>a.frees-b.frees);
  let fields=parseInt(document.getElementById("fields").value);
  while(activePlayers.length>=4 && matches.length<fields){
    let teamA=[activePlayers.shift(),activePlayers.pop()];
    let teamB=[activePlayers.shift(),activePlayers.pop()];
    matches.push({field:matches.length+1,teamA,teamB,score:null,completed:false});
  }
  // Freilose pro Runde
  activePlayers.forEach(p=>{p.frees=(p.frees||0)+1;});
  renderMatches();
}

// --- Siegwahrscheinlichkeit ---
function calcProbability(teamA,teamB){
  let eloA=teamA[0].elo+teamA[1].elo;
  let eloB=teamB[0].elo+teamB[1].elo;
  let probA=1/(1+10**((eloB-eloA)/400));
  return {A:(probA*100).toFixed(0),B:((1-probA)*100).toFixed(0)};
}

// --- Matches rendern ---
function renderMatches(){
  const container=document.getElementById("matches");
  container.innerHTML="";
  matches.forEach((m,idx)=>{
    const card=document.createElement("div");
    card.className="col-md-6 mb-3";
    const prob=calcProbability(m.teamA,m.teamB);
    let starA="",starB="";
    if(prob.A>prob.B) starA="⭐"; else if(prob.B>prob.A) starB="⭐";
    let probHTML="";
    if(document.getElementById("showProb").checked){
      probHTML=`<div class="mt-2"><em id="probText-${idx}">Wahrscheinlichkeit: Team A ${prob.A}% vs Team B ${prob.B}%</em></div>`;
    }
    card.innerHTML=`
      <div class="card">
        <div class="card-header">Feld ${m.field}</div>
        <div class="card-body">
          <div class="row">
            <div class="col-5 team-a">
              ${starA} ${m.teamA[0].emoji} ${m.teamA[0].name}<br>
              ${starA} ${m.teamA[1].emoji} ${m.teamA[1].name}
            </div>
            <div class="col-5 team-b">
              ${starB} ${m.teamB[0].emoji} ${m.teamB[0].name}<br>
              ${starB} ${m.teamB[1].emoji} ${m.teamB[1].name}
            </div>
            <div class="col-2">
              <input type="text" id="score-${idx}" class="form-control form-control-sm mb-1" placeholder="21:15">
              <button class="btn btn-sm btn-success w-100" onclick="setWinner(${idx})">✅ Ergebnis übernehmen</button>
            </div>
          </div>
          ${probHTML}
        </div>
      </div>
    `;
    container.appendChild(card);
  });

  // Freilose pro Runde
  const freePlayers = players.filter(p => !matches.some(m=>m.teamA.includes(p)||m.teamB.includes(p)));
  if(freePlayers.length){
    const freeCard=document.createElement("div");
    freeCard.className="col-12 mb-3";
    freeCard.innerHTML=`
      <div class="card">
        <div class="card-header text-warning">🎲 Freilos Spieler Runde ${round}</div>
        <div class="card-body">
          ${freePlayers.map(p=>`<span class="me-2">${p.emoji} ${p.name} (${p.elo.toFixed(0)})</span>`).join("<br>")}
        </div>
      </div>
    `;
    container.appendChild(freeCard);
  }
}

// --- ELO und Ergebnis übernehmen ---
function setWinner(idx){
  const scoreInput = document.getElementById(`score-${idx}`).value.trim();
  if(!scoreInput.match(/^\d+:\d+$/)) return alert("Bitte Score korrekt eingeben, z.B. 21:15");
  const [scoreA,scoreB]=scoreInput.split(":").map(Number);
  const m=matches[idx];
  if(m.completed) return alert("Ergebnis bereits übernommen!");
  m.score={A:scoreA,B:scoreB};
  m.completed=true;
  // ELO-Faktor
  const factor=Math.abs(scoreA-scoreB)/21;
  let winnerTeam, loserTeam;
  if(scoreA>scoreB){ winnerTeam=m.teamA; loserTeam=m.teamB; }
  else{ winnerTeam=m.teamB; loserTeam=m.teamA; }
  winnerTeam.forEach(p=>{p.wins++; p.played++; p.elo+=20*(1+factor); p.eloChange=20*(1+factor);});
  loserTeam.forEach(p=>{p.losses++; p.played++; p.elo-=10*(1+factor); p.eloChange=-10*(1+factor);});
  // Historie speichern
  history.push({round,field:m.field,teamA:m.teamA.map(p=>p.name),teamB:m.teamB.map(p=>p.name),score:scoreInput});
  renderHistory();
  renderRanking();
  alert("Ergebnis übernommen!");
}

// --- Historie ---
function renderHistory(){
  const tbody=document.getElementById("historyTable").querySelector("tbody");
  tbody.innerHTML="";
  history.forEach((h,idx)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${h.round}</td><td>${h.field}</td><td>${h.teamA.join(", ")}</td><td>${h.teamB.join(", ")}</td><td>${h.score}</td><td><button class="btn btn-sm btn-warning" onclick="editHistory(${idx})">✏️ Bearbeiten</button></td>`;
    tbody.appendChild(tr);
  });
}

function editHistory(idx){
  const newScore=prompt("Neuen Score eingeben (z.B.21:15)", history[idx].score);
  if(!newScore) return;
  history[idx].score=newScore;
  // Hier müsste ggf. die ELO neu berechnet werden
  renderHistory();
}

// --- Ranking ---
function renderRanking(){
  const tbody=document.getElementById("rankingTable").querySelector("tbody");
  tbody.innerHTML="";
  players.sort((a,b)=>b.elo-a.elo).forEach(p=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${p.name}</td><td>${p.club}</td><td>${p.elo.toFixed(0)}</td><td>${p.wins}</td><td>${p.played}</td>`;
    tbody.appendChild(tr);
  });
}

// --- Turnier beenden ---
function endTournament(){
  document.getElementById("summary").style.display="block";
  const tbody=document.getElementById("summaryTable");
  tbody.innerHTML="";
  players.forEach(p=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${p.name}</td><td>${p.startStrength}</td><td>${p.elo.toFixed(0)}</td>`;
    tbody.appendChild(tr);
  });
  alert("Turnier beendet!");
}

// --- CSV Export ---
function exportCSV(){
  let csv="Name,Verein,ELO,Siege,Spiele\n";
  players.forEach(p=>{
    csv+=`${p.name},${p.club},${p.elo.toFixed(0)},${p.wins},${p.played}\n`;
  });
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="turnier.csv";
  a.click();
  URL.revokeObjectURL(url);
}

</script>
</body>
</html>
