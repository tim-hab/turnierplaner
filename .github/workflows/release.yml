name: Build and release

on:
  push:
    branches:
      - release

permissions:
  contents: write
  issues: write
  repository-projects: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER || github.repository_owner }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Read package version
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json must contain a semantic version such as 1.2.3."
            exit 1
          fi

          echo "RELEASE_NAME=v${version}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: npm ci

      - name: Build Electron Windows application
        run: npm run electron:dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          if [[ -z "${PROJECT_NUMBER}" ]]; then
            echo "::error::Set the PROJECT_NUMBER repository variable."
            exit 1
          fi

          mapfile -t files < <(find release -type f \( -name '*.exe' -o -name '*.msi' \) -print)
          if (( ${#files[@]} == 0 )); then
            echo "::error::The Electron build did not produce a Windows installer in release."
            exit 1
          fi

          gh release create "${RELEASE_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_NAME}" \
            --generate-notes

      - name: Move done project items to released
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          if [[ -z "${PROJECT_NUMBER}" ]]; then
            echo "::error::Set the PROJECT_NUMBER repository variable."
            exit 1
          fi

          owner_type="$(gh api "users/${PROJECT_OWNER}" --jq '.type')"
          if [[ "${owner_type}" == "Organization" ]]; then
            query='
              query($login: String!, $number: Int!) {
                owner: organization(login: $login) {
                  projectV2(number: $number) {
                    id
                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }'
          elif [[ "${owner_type}" == "User" ]]; then
            query='
              query($login: String!, $number: Int!) {
                owner: user(login: $login) {
                  projectV2(number: $number) {
                    id
                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }'
          else
            echo "::error::Could not determine whether ${PROJECT_OWNER} is a user or organization."
            exit 1
          fi

          project_json="$(gh api graphql \
            -f query="${query}" \
            -F login="${PROJECT_OWNER}" \
            -F number="${PROJECT_NUMBER}")"

          project="$(jq -c '.data.owner.projectV2' <<<"${project_json}")"
          if [[ "${project}" == "null" ]]; then
            echo "::error::Project ${PROJECT_OWNER}#${PROJECT_NUMBER} was not found."
            exit 1
          fi

          project_id="$(jq -r '.id' <<<"${project}")"
          status_field="$(jq -c '.fields.nodes[] | select(.name == "Status")' <<<"${project}")"
          if [[ -z "${status_field}" ]]; then
            echo "::error::The project has no single-select Status field."
            exit 1
          fi

          done_option_id="$(jq -r '.options[] | select(.name == "Done") | .id' <<<"${status_field}")"
          released_option_id="$(jq -r '.options[] | select(.name == "Released") | .id' <<<"${status_field}")"
          if [[ -z "${done_option_id}" || -z "${released_option_id}" ]]; then
            echo "::error::The project Status field must contain both Done and Released options."
            exit 1
          fi
          status_field_id="$(jq -r '.id' <<<"${status_field}")"

          items_query='
            query($projectId: ID!, $cursor: String) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  items(first: 100, after: $cursor) {
                    nodes {
                      id
                      content {
                        __typename
                        ... on Issue { number repository { nameWithOwner } }
                        ... on PullRequest { number repository { nameWithOwner } }
                      }
                      fieldValues(first: 100) {
                        nodes {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            field { ... on ProjectV2SingleSelectField { name } }
                            optionId
                          }
                        }
                      }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }'

          declare -A milestone_numbers=()
          cursor=""
          while :; do
            if [[ -n "${cursor}" ]]; then
              items_json="$(gh api graphql -f query="${items_query}" -f projectId="${project_id}" -f cursor="${cursor}")"
            else
              items_json="$(gh api graphql -f query="${items_query}" -f projectId="${project_id}" -F cursor=null)"
            fi

            while IFS=$'\t' read -r item_id content_type issue_number repository status_option_id; do
              [[ -n "${item_id}" && "${status_option_id}" == "${done_option_id}" ]] || continue
              [[ -n "${issue_number}" && -n "${repository}" ]] || continue

              if [[ -z "${milestone_numbers[${repository}]+x}" ]]; then
                milestones_json="$(gh api --paginate --slurp \
                  "repos/${repository}/milestones?state=all&per_page=100")"
                milestone_number="$(jq -r --arg release_name "${RELEASE_NAME}" \
                  '.[].[] | select(.title == $release_name) | .number' <<<"${milestones_json}" | head -n 1)"
                if [[ -z "${milestone_number}" ]]; then
                  milestone_number="$(gh api "repos/${repository}/milestones" \
                    --method POST \
                    -f title="${RELEASE_NAME}" \
                    -f description="Items included in release ${RELEASE_NAME}." \
                    --jq '.number')"
                fi
                milestone_numbers["${repository}"]="${milestone_number}"
              fi
              milestone_number="${milestone_numbers[${repository}]}"

              gh api graphql \
                -f query='mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }' \
                -f projectId="${project_id}" \
                -f itemId="${item_id}" \
                -f fieldId="${status_field_id}" \
                -f optionId="${released_option_id}" >/dev/null

              gh api "repos/${repository}/issues/${issue_number}" \
                --method PATCH \
                -F milestone="${milestone_number}" >/dev/null
              echo "Released ${content_type} #${issue_number}."
            done < <(jq -r '
              .data.node.items.nodes[] |
              [
                .id,
                (.content.__typename // ""),
                (.content.number // ""),
                (.content.repository.nameWithOwner // ""),
                ((.fieldValues.nodes[]? | select(.field.name == "Status") | .optionId) // "")
              ] | @tsv' <<<"${items_json}")

            has_next_page="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<<"${items_json}")"
            [[ "${has_next_page}" == "true" ]] || break
            cursor="$(jq -r '.data.node.items.pageInfo.endCursor' <<<"${items_json}")"
          done
